services:
  rollcall-api:
    image: ghcr.io/devdays-rollcall/monitor-backend:alert-source-20261111
    environment:
      APP_ROLE: api
      NTFY_INTERNAL_URL: http://rollcall-ntfy:80
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-https://notify.rollcall.vareonix.cc}
      NATS_URL: ${NATS_URL:?Set NATS_URL}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/monitordb
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks:
      - shared
    restart: always

  rollcall-worker:
    image: ghcr.io/devdays-rollcall/monitor-backend:release-23673b7
    environment:
      APP_ROLE: worker
      NATS_URL: ${NATS_URL:?Set NATS_URL}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/monitordb
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks:
      - shared
    restart: always

  rollcall-ntfy:
    image: binwiederhier/ntfy:v2.37.2
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-https://notify.rollcall.vareonix.cc}
      NTFY_LISTEN_HTTP: :80
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_WEB_PUSH_PUBLIC_KEY: ${NTFY_WEB_PUSH_PUBLIC_KEY:?Set NTFY_WEB_PUSH_PUBLIC_KEY}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${NTFY_WEB_PUSH_PRIVATE_KEY:?Set NTFY_WEB_PUSH_PRIVATE_KEY}
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${NTFY_WEB_PUSH_EMAIL_ADDRESS:?Set NTFY_WEB_PUSH_EMAIL_ADDRESS}
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy
    networks:
      - shared
    restart: always

volumes:
  ntfy-cache:

networks:
  shared:
    external: true
    name: vareonix-4801b5551dc3
