services:
  rollcall-api:
    image: ghcr.io/devdays-rollcall/monitor-backend:release-20261110145432
    environment:
      APP_ROLE: api
      NATS_URL: ${NATS_URL:?Set NATS_URL}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/monitordb
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks:
      - shared
    restart: always

  rollcall-worker:
    image: ghcr.io/devdays-rollcall/monitor-backend:release-20261110145432
    environment:
      APP_ROLE: worker
      NATS_URL: ${NATS_URL:?Set NATS_URL}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/monitordb
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks:
      - shared
    restart: always

networks:
  shared:
    external: true
    name: vareonix-4801b5551dc3
