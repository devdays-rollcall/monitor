openapi: 3.0.3
info:
  title: Group Tracking API
  version: 1.0.0
  description: |
    API принимает события участников туристической группы и возвращает их историю.
    Одно устройство может отправлять свои события и события других участников,
    полученные через p2p. События передаются в JSON.

    Ключ группы передается в заголовке `Authorization: Bearer <group_token>`.
    Он создается на устройстве лидера из 32 криптографически случайных байтов
    и кодируется в base64url без padding. Один и тот же ключ используют все
    устройства группы. Ключ просмотра дает только доступ к чтению.
servers:
  - url: /
security:
  - groupToken: []
paths:
  /api/v1/events:
    post:
      operationId: postEvents
      summary: Accept a batch of events
      description: |
        Проверяет всю пачку и публикует ее в очередь. Максимум: 500 событий
        и 1 МиБ на тело запроса. Пустой массив `events` допустим и служит
        heartbeat отправителя.

        Ответ 202 означает, что очередь подтвердила прием пачки. Worker сохраняет
        события асинхронно, поэтому они могут появиться в GET позже. Необработанные
        сообщения удаляются из очереди через 24 часа.

        Группа создается при обработке первого запроса worker. До этого GET
        может вернуть 404, даже если POST уже ответил 202.

        При повторной отправке сохраняйте исходные ID и содержимое событий.
        События с тем же ID в одной группе не создают повторных записей. Если
        содержимое повторного события отличается, первая запись сохраняется,
        а конфликт попадает в журнал worker; ответ 202 его не отражает.
      requestBody:
        required: true
        description: Пачка событий одного отправителя. События могут принадлежать разным участникам группы.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            example:
              sender_id: c9c7458e-3d19-4e20-ae5d-dbc3ec6f4af1
              events:
                - id: d8a6b9f0-32b1-4b1d-a186-a86f2e401a11
                  member_id: 3d783127-6f1d-454d-b99f-dd41f88f51dd
                  type: location
                  recorded_at: '2026-11-09T12:00:00Z'
                  data:
                    latitude: 43.3499
                    longitude: 42.4453
                    accuracy_m: 8.5
                    altitude_m: 1564.2
                    speed_mps: 1.4
                    bearing_deg: 92.0
                    battery_percent: 78
      responses:
        '202':
          description: Очередь подтвердила прием всей пачки; запись в базу выполняется асинхронно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidEvent'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: getEvents
      summary: Read stored events with a group or viewing token
      description: |
        Возвращает сохраненные события группы в порядке их записи в базу,
        не по времени измерения. Для построения маршрута сортируйте точки
        каждого участника по `recorded_at`.

        Для следующей страницы передайте `next_cursor` предыдущего ответа
        в параметре `cursor`. Когда `next_cursor` равен null, страниц больше нет.
      security:
        - groupToken: []
        - viewToken: []
      parameters:
        - name: limit
          in: query
          description: Максимальное число событий на странице.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: cursor
          in: query
          description: Непрозрачный `next_cursor` из предыдущего ответа. В первом запросе не передается.
          schema:
            type: string
      responses:
        '200':
          description: Страница сохраненных событий; для существующей группы массив может быть пустым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/share-links:
    post:
      operationId: createShareLink
      summary: Create a viewing token for an existing group
      description: |
        Создает отдельный случайный ключ просмотра для существующей группы.
        Требуется ключ группы. Ключ просмотра позволяет включать предупреждения и подтверждать их снятие, но не позволяет отправлять
        события или создавать другие ключи. Срок действия и отзыв не предусмотрены.
      responses:
        '201':
          description: Создан ключ просмотра, начинающийся с `view_`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/alert:
    get:
      operationId: getAlert
      summary: Read the group warning and notification subscription address
      parameters:
        - name: X-Observer-Key
          in: header
          required: false
          schema:
            type: string
          description: Идентификатор браузера для проверки его регистрации и голоса.
      security:
        - groupToken: []
        - viewToken: []
      responses:
        '200':
          description: Текущее предупреждение и адрес подписки ntfy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: raiseAlert
      summary: Activate a warning and notify the group observers
      parameters:
        - name: X-Alert-Source
          in: header
          required: false
          schema:
            type: string
            enum: [observer, sos]
            default: observer
          description: SOS может отправить только участник с ключом группы.
        - name: X-Alert-Member-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: UUID участника, отправившего SOS; отсутствует у старых клиентов.
      security:
        - groupToken: []
        - viewToken: []
      responses:
        '200':
          description: Предупреждение активно; поле notified показывает, принял ли ntfy сообщение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Ключ просмотра не позволяет отправить SOS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: clearAlert
      summary: Clear an active warning
      parameters:
        - name: X-Alert-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор предупреждения, которое нужно снять.
      security:
        - groupToken: []
        - viewToken: []
      responses:
        '200':
          description: Текущее состояние после снятия предупреждения любым наблюдателем.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertState'
        '409':
          description: Предупреждение уже изменилось; обновите состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/observers:
    post:
      operationId: registerObserver
      deprecated: true
      summary: Register a browser as a group observer
      parameters:
        - $ref: '#/components/parameters/ObserverKey'
      security:
        - groupToken: []
        - viewToken: []
      responses:
        '204':
          description: Браузер зарегистрирован; повторная регистрация не создаёт нового наблюдателя.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    ObserverKey:
      name: X-Observer-Key
      in: header
      required: true
      description: Случайный ключ браузера, 32 байта в base64url без padding.
      schema:
        type: string
  securitySchemes:
    groupToken:
      type: http
      scheme: bearer
      description: |
        Ключ группы дает право читать и отправлять события, а также создавать
        ключи просмотра. Передавайте его только в заголовке Authorization.
    viewToken:
      type: http
      scheme: bearer
      description: Ключ с префиксом `view_` для чтения событий, включения и снятия предупреждения.
  responses:
    BadRequest:
      description: Некорректный JSON, формат пачки, `limit` или `cursor`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Ключ отсутствует, имеет неверный формат или не подходит для этой операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: Тело запроса превышает 1 МиБ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidEvent:
      description: Некорректное событие; вся пачка отклонена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Группа или ключ просмотра не найдены.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Очередь или хранилище недоступны. Запрос можно повторить после восстановления.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AlertState:
      type: object
      required: [active, alert_id, subscription_url, observers, approvals, required_approvals, registered, approved]
      properties:
        active:
          type: boolean
        alert_id:
          type: string
          format: uuid
          nullable: true
          description: Идентификатор текущего предупреждения; null, если оно снято.
        source:
          type: string
          enum: [observer, sos, unknown]
          nullable: true
          description: Источник текущего предупреждения; неизвестен для прежних предупреждений.
        member_id:
          type: string
          format: uuid
          nullable: true
          description: Участник последнего SOS; отсутствует, если его ID неизвестен.
        username:
          type: string
          nullable: true
          description: Последнее известное имя участника, отправившего SOS.
        observers:
          type: integer
          description: Сохранено для совместимости; регистрация для снятия больше не нужна.
        approvals:
          type: integer
          description: Сохранено для совместимости; голосование отключено.
        required_approvals:
          type: integer
          description: Для снятия достаточно одного наблюдателя.
        registered:
          type: boolean
          description: Сохранено для совместимости; регистрация больше не нужна.
        approved:
          type: boolean
          description: Сохранено для совместимости; голосование отключено.
        subscription_url:
          type: string
          format: uri
          description: Секретный адрес топика ntfy; любой, кто его знает, может читать и отправлять сообщения.
    AlertResult:
      type: object
      required: [notified]
      properties:
        notified:
          type: boolean
          description: Сервис ntfy подтвердил приём уведомления; доставка отдельным подписчикам не гарантируется.
    ShareToken:
      type: object
      description: Отдельный ключ просмотра, созданный сервером для группы.
      required: [token]
      properties:
        token:
          type: string
          description: Ключ просмотра с префиксом `view_`. Его можно передать получателю ссылки.
    EventBatch:
      type: object
      description: События, переданные одним устройством за один HTTP-запрос.
      required: [sender_id, events]
      properties:
        sender_id:
          type: string
          format: uuid
          description: UUID устройства, выполняющего HTTP-запрос. Может отличаться от `member_id` события.
        events:
          type: array
          maxItems: 500
          description: События участников. Пустой массив означает heartbeat отправителя.
          items:
            $ref: '#/components/schemas/EventInput'
    EventInput:
      type: object
      description: Событие, созданное устройством участника и передаваемое на сервер.
      required: [id, member_id, type, recorded_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv4 события. Создается один раз и сохраняется при p2p-передаче и повторной отправке.
        member_id:
          type: string
          format: uuid
          description: UUIDv4 участника, создавшего событие. Сохраняется на устройстве и не меняется в группе.
        username:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          description: Имя участника на момент события; можно не передавать.
        type:
          type: string
          enum: [location]
          description: Тип события. Сейчас поддерживается только `location` — измерение местоположения.
        recorded_at:
          type: string
          format: date-time
          description: Время измерения на устройстве в формате RFC 3339 с часовым поясом.
          example: '2026-11-09T12:00:00Z'
        data:
          $ref: '#/components/schemas/LocationData'
    EventOutput:
      type: object
      description: Сохраненное событие с временем приема сервером.
      required: [id, member_id, type, recorded_at, received_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: Исходный UUID события, заданный устройством.
        member_id:
          type: string
          format: uuid
          description: UUID участника, создавшего событие.
        username:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          description: Имя участника на момент события; можно не передавать.
        type:
          type: string
          enum: [location]
          description: Тип события; сейчас поддерживается `location`.
        recorded_at:
          type: string
          format: date-time
          description: Время измерения на устройстве в формате RFC 3339.
        received_at:
          type: string
          format: date-time
          description: Время приема HTTP-запроса сервером, в формате RFC 3339.
        data:
          $ref: '#/components/schemas/LocationData'
    LocationData:
      type: object
      description: |
        Координаты и дополнительные показания для события `location`.
        Необязательные измерения можно пропустить; не передавайте null и не
        подставляйте 0 вместо отсутствующего значения. Дополнительные поля
        сохраняются сервером.
      required: [latitude, longitude]
      additionalProperties: true
      properties:
        latitude:
          type: number
          format: double
          description: Широта в десятичных градусах; северная широта положительная.
          example: 43.3499
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          description: Долгота в десятичных градусах; восточная долгота положительная.
          example: 42.4453
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          format: double
          description: Горизонтальная точность местоположения в метрах.
          example: 8.5
          minimum: 0
        altitude_m:
          type: number
          format: double
          description: Высота в метрах.
          example: 1564.2
        speed_mps:
          type: number
          format: double
          description: Скорость движения в метрах в секунду.
          example: 1.4
          minimum: 0
        bearing_deg:
          type: number
          format: double
          description: Направление движения в градусах по часовой стрелке от севера; 0 — север, 90 — восток.
          example: 92.0
          minimum: 0
          maximum: 360
          exclusiveMaximum: true
        battery_percent:
          type: integer
          description: Уровень заряда батареи устройства участника в процентах.
          example: 78
          minimum: 0
          maximum: 100
    Accepted:
      type: object
      description: Подтверждение приема пачки в очередь.
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Число событий в принятой пачке, включая возможные дубликаты; для heartbeat равно 0.
          minimum: 0
          maximum: 500
    EventPage:
      type: object
      description: Страница событий группы и указатель следующей страницы.
      required: [events, next_cursor]
      properties:
        events:
          type: array
          description: События в порядке сохранения в базе, не по `recorded_at`.
          items:
            $ref: '#/components/schemas/EventOutput'
        next_cursor:
          type: string
          nullable: true
          description: Курсор для следующего запроса; null означает, что следующей страницы нет.
    ErrorResponse:
      type: object
      description: Ошибка обработки HTTP-запроса.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      description: Машинный код ошибки и текстовое описание.
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код ошибки, например `invalid_token` или `invalid_event`.
        message:
          type: string
          description: Текстовое описание причины ошибки.
