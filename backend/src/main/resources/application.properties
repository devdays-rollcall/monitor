quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.limits.max-body-size=2M
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.devservices.enabled=false
quarkus.log.console.json.enabled=true
app.role=${APP_ROLE:api}
nats.url=${NATS_URL:nats://localhost:4222}

ntfy.public-url=${NTFY_PUBLIC_URL:http://localhost:2586}
ntfy.internal-url=${NTFY_INTERNAL_URL:http://localhost:2586}
